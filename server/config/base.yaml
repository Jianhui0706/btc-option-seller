# BTC 期权卖方策略 V2 — 策略与风控参数
# 密钥不放这里（见 .env）。testnet.yaml / mainnet.yaml 中的同名项覆盖本文件。

strategy:
  name: BTC_OPTION_SELLER_V2
  currency: BTC
  min_lot: 0.1                       # Deribit BTC 期权最小下单量（张）
  dvol_entry_levels: [0.40, 0.60, 0.85]   # 与 Pine dvol_entry_level_1/2/3 一致（0~1）

# ⚠ 待确认口径：档位→卖腿|Delta|/DTE 映射为占位值（DTE 分段参考 V1 文档
# "高波动短 DTE"），实盘前必须由用户确认后修改。
leg_selection:
  tier_map:
    1: { sell_delta: 0.15, dte_lo: 30, dte_hi: 45 }
    2: { sell_delta: 0.20, dte_lo: 20, dte_hi: 35 }
    3: { sell_delta: 0.25, dte_lo: 14, dte_hi: 28 }
  sell_delta_min: 0.05               # 卖腿 Delta 约束（沿用 V1 文档）
  sell_delta_max: 0.70
  # ⚠ 待确认口径：买腿按"反向盈亏比"选择的占位实现——
  # 在满足 max_loss/net_credit ≤ risk_reward_max 的候选中选权利金最便宜（最虚值）者。
  # （Delta≈0.2 的信用价差典型盈亏比 8~13，阈值 12 为流程验证用占位值）
  risk_reward_max: 12.0
  min_credit_btc: 0.0005             # 每张最低净收权利金（实际 bid/ask 口径）

risk:
  # ⚠ 待确认口径：每笔最大亏损 ≤ 账户权益 × account_risk_pct（对应文档 delta_account_risk_pct=2%）
  account_risk_pct: 0.02
  daily_loss_limit_pct: 0.05         # ⚠ 占位：日亏损超权益 5% → FORCE_CLOSE_RISK
  margin_ratio_limit: 0.60           # ⚠ 占位：维持保证金/权益 > 60% → FORCE_CLOSE_RISK
  quote_missing_scans: 5             # 盘口连续缺失 N 轮扫描 → FORCE_CLOSE_RISK
  delta_anomaly_btc: 1.0             # ⚠ 占位：|净Delta| 超过该绝对值视为异常扩大

hedge:
  delta_account_risk_pct: 0.02       # 文档十：2%
  delta_trigger_pct: 0.10            # 文档十：10%（trigger = equity × 2% × 10%）
  call_release_pct: 0.98             # Call 对冲撤销线 BEP × 0.98
  put_release_pct: 1.02              # Put 对冲撤销线 BEP × 1.02
  perp_instrument: BTC-PERPETUAL
  perp_contract_usd: 10              # 永续合约面值（美元），下单量取整到其倍数
  ioc_ticks: 5                       # 对冲 IOC 限价越过对手价的 tick 数

exit:
  dvol_window_bars: 120              # 最近 120 个已完成 12h DVOL 值
  dvol_percentile: 30
  keep_buy_leg_on_normal_exit: false # 正常退出默认双腿全平；true=只平卖腿保留买腿
  expiry_close_dte: 1.0              # 距到期 ≤ 1 天平仓（沿用 V1）

scan:
  interval_sec: 180                  # 3 分钟扫描
  bar_align_offset_sec: 5            # bar 边界后偏移几秒执行

execution:
  n_exec_groups: 5                   # 执行分批数（下单节奏，≠管理子组 group_split_count）
  attempt_waits: [3, 8, 15]          # mid → 2/3 touch → IOC 等待秒数（沿用 V1）

group_split_count_default: 4         # webhook 未带时的默认管理子组数

webhook:
  host: 0.0.0.0
  port: 8300

# 仅供开发/testnet 验证使用的旁路（mainnet.yaml 必须全部为 null/false）
debug:
  bep_override: null                 # 强制 BEP 价格，驱动对冲激活路径测试
  trigger_override: null             # 强制 effective_delta_trigger
  dry_run: false                     # 执行层只报价不下单
