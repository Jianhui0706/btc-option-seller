# BTC 期权卖方策略 V2 — 策略与风控参数
# 密钥不放这里（见 .env）。testnet.yaml / mainnet.yaml 中的同名项覆盖本文件。

strategy:
  name: BTC_OPTION_SELLER_V2
  currency: BTC
  min_lot: 0.1                       # Deribit BTC 期权最小下单量（张）
  dvol_entry_levels: [0.40, 0.60, 0.85]   # 与 Pine dvol_entry_level_1/2/3 一致（0~1）
  dvol_entry_window_days: 730             # 只读诊断窗口；V2 交易判断以 TradingView 为准

# ⚠ 待确认口径：档位→卖腿|Delta|/DTE 映射为占位值（DTE 分段参考 V1 文档
# "高波动短 DTE"），实盘前必须由用户确认后修改。
leg_selection:
  tier_map:
    1: { sell_delta: 0.15, dte_lo: 30, dte_hi: 45 }
    2: { sell_delta: 0.20, dte_lo: 20, dte_hi: 35 }
    3: { sell_delta: 0.25, dte_lo: 14, dte_hi: 28 }
  sell_delta_min: 0.05               # 卖腿 Delta 约束（沿用 V1 文档）
  sell_delta_max: 0.70
  sell_delta_search_radius: 0.10     # 目标 Delta 附近逐个尝试卖腿；不允许为成交无限偏离目标
  min_credit_btc: 0.0005             # 每张最低净收权利金（实际 bid/ask 口径）

risk:
  # ⚠ 待确认口径：每笔最大亏损 ≤ 账户权益 × account_risk_pct（对应文档 delta_account_risk_pct=2%）
  account_risk_pct: 0.02
  portfolio_risk_pct: 0.06          # 活跃价差的剩余最大风险合计上限；部分平仓会释放额度
  daily_loss_limit_pct: 0.05         # ⚠ 占位：日亏损超权益 5% → FORCE_CLOSE_RISK
  margin_ratio_limit: 0.60           # ⚠ 占位：维持保证金/权益 > 60% → FORCE_CLOSE_RISK
  quote_missing_scans: 5             # 盘口连续缺失 N 轮扫描 → FORCE_CLOSE_RISK
  delta_anomaly_btc: 1.0             # ⚠ 占位：|净Delta| 超过该绝对值视为异常扩大
  auto_pause_enabled: false          # 人工处理开关仓位，不自动暂停或强平

hedge:
  delta_account_risk_pct: 0.02       # 文档十：2%
  delta_trigger_pct: 0.10            # 文档十：10%（trigger = equity × 2% × 10%）
  rebalance_outer_equity_pct: 0.02   # 调仓外层阈值 = 账户权益 2% Delta；避免 0.2% 阈值造成高频来回交易
  rebalance_inner_ratio: 0.00        # 触发后以 Delta 中性为目标；仅保留字段兼容旧配置
  min_rebalance_usd: 5000            # 小于该计划额不调仓
  rebalance_cooldown_sec: 360        # 普通成交后 6 分钟冷却；紧急阈值可绕过
  emergency_trigger_multiplier: 2.0 # |Delta| 达到外层阈值 2 倍时忽略冷却
  hedge_scope: SIDE_BOOK             # PUT/CALL 独立判断，BTC-PERPETUAL 最终净额执行
  review_bar_minutes: 1              # 完整复核 Bar 周期
  release_confirmation_bars: 1       # 进入撤销区后，再确认 1 根完整复核 Bar
  activation_price_source: REALTIME_INDEX # 保留实时指数 tick 激活
  bep_activation_progress: 1.00      # 主策略文档 α：到达 BEP（100%）时激活；运行时允许 0%～200%
  release_recovery_pct: 0.50         # 参考文档 β：从 BEP 向开仓价恢复 50%
  hedge_release_progress: 0.05       # 回到开仓价至 BEP 的 5% 位置并经下一根完整 bar 确认后撤销
  call_release_pct: 0.98             # 旧信号兼容字段；新撤销逻辑使用 hedge_release_progress
  put_release_pct: 1.02              # 旧信号兼容字段；新撤销逻辑使用 hedge_release_progress
  perp_instrument: BTC-PERPETUAL
  perp_contract_usd: 10              # 永续合约面值（美元），下单量取整到其倍数
  ioc_ticks: 5                       # 对冲 IOC 限价越过对手价的 tick 数
  retry_rounds: 3                    # 部分/零成交同一轮最多尝试次数
  retry_delay_sec: 1.5               # 每轮之间重读真实仓位和 Delta 前的等待
  retry_tick_step: 5                 # 每轮额外增加的吃单 tick 数：5 / 10 / 15
  degraded_retry_sec: 15             # 三轮仍未达标时的高优先级重试间隔
  manual_rearm_sec: 10               # 人工取消对冲完成后，至少 10 秒才允许自动重新激活
  put:
    rebalance_outer_equity_pct: 0.02
    min_rebalance_usd: 5000
    rebalance_cooldown_sec: 360
    emergency_trigger_multiplier: 2.0
  call:
    rebalance_outer_equity_pct: 0.02
    min_rebalance_usd: 5000
    rebalance_cooldown_sec: 360
    emergency_trigger_multiplier: 2.0

exit:
  dvol_window_bars: 120              # 最近 120 个已完成 12h DVOL 值
  dvol_percentile: 30
  keep_buy_leg_on_normal_exit: false # 正常退出默认双腿全平；true=只平卖腿保留买腿
  expiry_policy: HOLD_TO_EXPIRY      # 正常持有到 Deribit 到期结算，不提前发送平仓单
  expiry_close_dte: 1.0              # 仅 CLOSE_BEFORE_EXPIRY 兼容模式使用

scan:
  interval_sec: 180                  # 3 分钟扫描
  bar_align_offset_sec: 5            # bar 边界后偏移几秒执行

# 信号中心「开仓条件看板」用：后端独立复现 Pine 的开仓门槛做诊断。
# ⚠ 改这里必须同步改 Pine 的 grpSig 同名 input，否则看板会和真实信号打架。
entry_signal:
  boll_len: 20                       # 布林带周期（2h）⚠待核对
  boll_mult: 2.0                     # 布林带标准差倍数 ⚠待核对
  cci_len: 20                        # CCI 周期（2h），输入源 = 典型价 hlc3
  cci_max: 101.0                     # abs(CCI) 上限，超过即不发信号
  hv_len: 20                         # HV 计算窗口（2h bar 数）⚠待核对
  hv_pctl_window: 252                # HV 分位窗口（2h bar 数）⚠待核对
  hv_pctl_min: 30.0                  # HV 分位下限 (%)
  snapshot_ttl_sec: 15               # 2h 门槛快照缓存秒数（看板准实时刷新；DVOL 2年分位另走长缓存）

execution:
  n_exec_groups: 5                   # 执行分批数（下单节奏，≠管理子组 group_split_count）
  attempt_waits: [3, 8, 15]          # mid → 2/3 touch → IOC 等待秒数（沿用 V1）
  manual_hedge_maker_wait_sec: 10    # 一键开/关对冲：每组 A1、A2 Maker 各等待 10 秒

group_split_count_default: 4         # webhook 未带时的默认管理子组数

webhook:
  host: 0.0.0.0
  port: 8300

# 仅供开发/testnet 验证使用的旁路（mainnet.yaml 必须全部为 null/false）
debug:
  bep_override: null                 # 强制 BEP 价格，驱动对冲激活路径测试
  trigger_override: null             # 强制 effective_delta_trigger
  dry_run: false                     # 执行层只报价不下单
